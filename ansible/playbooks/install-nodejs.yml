---
- name: Install Node.js 20 on Debian servers
  hosts: all
  gather_facts: true
  become: true
  become_user: root
  vars:
    nodejs_version: "20"
    nodesource_key_url: "https://deb.nodesource.com/gpgkey/nodesource.gpg.key"
    nodesource_repo_url: "https://deb.nodesource.com/node_{{ nodejs_version }}.x"
    
  tasks:
    - name: Update APT package cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      tags:
        - install
        - update
      
    - name: Install required packages for repository management
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
      tags:
        - install
        - prerequisites
      
    - name: Add NodeSource GPG key
      ansible.builtin.apt_key:
        url: "{{ nodesource_key_url }}"
        state: present
      tags:
        - install
        - repository
      
    - name: Add NodeSource repository for Node.js {{ nodejs_version }}
      ansible.builtin.apt_repository:
        repo: "deb {{ nodesource_repo_url }} {{ ansible_distribution_release }} main"
        state: present
        update_cache: yes
      tags:
        - install
        - repository
      
    - name: Install Node.js {{ nodejs_version }}
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: yes
      tags:
        - install
        - nodejs
      
    - name: Verify Node.js installation
      ansible.builtin.command:
        cmd: node --version
      register: node_version_check
      changed_when: false
      failed_when: node_version_check.rc != 0
      tags:
        - verify
        - validation
      
    - name: Display Node.js version
      ansible.builtin.debug:
        msg: "Node.js {{ nodejs_version }} successfully installed. Version: {{ node_version_check.stdout }}"
      when: node_version_check.rc == 0
      tags:
        - verify
        - info
      
  handlers:
    - name: Clear APT cache
      ansible.builtin.command:
        cmd: apt-get clean
      listen: "clear apt cache"
      
  post_tasks:
    - name: Trigger APT cache cleanup
      ansible.builtin.meta: flush_handlers
      
    - name: Ensure playbook completes successfully
      ansible.builtin.debug:
        msg: "Node.js installation completed successfully on {{ inventory_hostname }}"
      tags:
        - verify
        - completion
