---
- name: Install Node.js v20 on Debian servers
  hosts: all
  become: yes
  gather_facts: yes

  tasks:
    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      tags:
        - install
        - update

    - name: Add NodeSource repository for Node.js 20
      ansible.builtin.apt_repository:
        repo: "deb https://deb.nodesource.com/node_20.x {{ ansible_distribution_release }} main"
        state: present
        update_cache: yes
        filename: nodesource
      when: ansible_os_family == 'Debian'
      tags:
        - install
        - repository

    - name: Install Node.js package
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: no
      when: ansible_os_family == 'Debian'
      tags:
        - install
        - nodejs

    - name: Verify Node.js installation
      ansible.builtin.command:
        cmd: node --version
      register: node_version
      changed_when: false
      tags:
        - verify
        - validation

    - name: Display Node.js version
      ansible.builtin.debug:
        msg: "Node.js version installed: {{ node_version.stdout }}"
      tags:
        - verify
        - info
